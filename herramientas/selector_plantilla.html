<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elegir imágenes del Ordo</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1f1f1f;--muted:#6b6b6b;--line:#e2dfd8;--acc:#8a1c1c;--ok:#2e7d32}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--fg:#ececec;--muted:#9a9a9a;--line:#333;--acc:#e0726b;--ok:#7bc47f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}select,input,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button.prim{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}#prog{color:var(--muted)}
main{padding:16px;display:grid;gap:14px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.hecha{border-color:var(--ok)}.tit{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tit b{font-size:16px}.meta{color:var(--muted);font-size:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.th{flex:0 0 auto;width:150px;cursor:pointer;border:3px solid transparent;border-radius:10px;padding:2px;text-align:center}
.th img{width:100%;height:150px;object-fit:cover;border-radius:7px;background:var(--line);display:block}
.th small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.sel{border-color:var(--acc)}.th.rot{width:110px;display:flex;align-items:center;justify-content:center;height:160px;border:2px dashed var(--line);color:var(--muted);font-size:13px}
.th.rot.sel{border:3px solid var(--acc);color:var(--fg)}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}.fila input{flex:1;min-width:220px}
a{color:var(--acc)}.vacio{color:var(--muted);font-size:13px;padding:8px 0}
</style></head><body>
<header>
  <h1>Elegir imágenes</h1>
  <select id="fMes"><option value="">Todos los meses</option><option value="00">Fiestas móviles</option></select>
  <select id="fEstado"><option value="">Todas</option><option value="sin">Sin imagen</option><option value="varias">Con varias opciones</option><option value="pend">Pendientes de elegir</option></select>
  <input id="fBus" placeholder="Buscar santo o fiesta…">
  <span id="prog"></span>
  <button class="prim" id="exp">Descargar mi selección</button>
</header>
<main id="lista"></main>
<script>
const D=/*DATOS*/null;
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
MESES.forEach((m,i)=>{const o=document.createElement('option');o.value=String(i+1).padStart(2,'0');o.textContent=m;fMes.appendChild(o)});
let sel={};try{sel=JSON.parse(localStorage.getItem('ordo_sel')||'{}')}catch(e){}
D.items.forEach(it=>{if(it.fija&&!(it.clave in sel))sel[it.clave]=it.fija});
const guardar=()=>{try{localStorage.setItem('ordo_sel',JSON.stringify(sel))}catch(e){};prog()};
const thumb=id=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w320`;
const idDe=s=>{s=(s||'').trim();const m=s.match(/(?:\/d\/|id=)([\w-]{20,})/);return m?m[1]:(/^[\w-]{20,}$/.test(s)?s:'')};
function prog(){const n=Object.keys(sel).length;document.getElementById('prog').textContent=`${n} de ${D.items.length} elegidas`}
function card(it){
  const c=document.createElement('div');c.className='card'+(sel[it.clave]?' hecha':'');
  const reg=it.region?` · ${it.region}`:'';
  c.innerHTML=`<div class="tit"><b>${it.fecha==='móvil'?'':it.fecha.split('-').reverse().join('/')+' · '}${it.nombre}</b><span class="meta">${it.grado}${reg} · ${it.opciones.length} opción(es)</span></div>`;
  const t=document.createElement('div');t.className='thumbs';
  const extra=[...new Set([...(it.opciones), ...(sel[it.clave]&&!it.opciones.includes(sel[it.clave])?[sel[it.clave]]:[])])];
  const rot=document.createElement('div');rot.className='th rot'+(!sel[it.clave]?' sel':'');
  rot.textContent=it.opciones.length>1?'Rotar cada año':(it.opciones.length?'Usar la única':'Sin imagen');
  rot.onclick=()=>{delete sel[it.clave];guardar();c.replaceWith(card(it))};t.appendChild(rot);
  const add=id=>{const d=document.createElement('div');d.className='th'+(sel[it.clave]===id?' sel':'');
    d.innerHTML=`<img loading="lazy" src="${thumb(id)}" alt=""><small>${D.archivos[id]||id}</small>`;
    d.onclick=()=>{sel[it.clave]=id;guardar();c.replaceWith(card(it))};t.appendChild(d)};
  extra.forEach(add);c.appendChild(t);
  if(!extra.length){const v=document.createElement('div');v.className='vacio';v.textContent='No hay imágenes en Drive para esta fecha. Pegá un enlace abajo o elegí entre las del mes.';c.appendChild(v)}
  const f=document.createElement('div');f.className='fila';
  f.innerHTML=`<input placeholder="Pegar enlace de Google Drive de otra imagen"><button>Usar</button><button>Ver otras del mes</button>`;
  const [inp,bUsar,bMes]=f.querySelectorAll('input,button');
  bUsar.onclick=()=>{const id=idDe(inp.value);if(!id){inp.value='';inp.placeholder='Enlace no válido';return}sel[it.clave]=id;guardar();c.replaceWith(card(it))};
  bMes.onclick=()=>{const pool=(D.por_mes[it.mes]||[]).filter(x=>!extra.includes(x));if(!pool.length){bMes.textContent='No hay otras';return}
    pool.forEach(add);bMes.remove()};
  c.appendChild(f);return c}
function pintar(){
  const m=fMes.value,e=fEstado.value,q=fBus.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const L=document.getElementById('lista');L.innerHTML='';
  D.items.filter(it=>(!m||it.mes===m)&&(!e||(e==='sin'&&!it.opciones.length&&!sel[it.clave])||(e==='varias'&&it.opciones.length>1)||(e==='pend'&&!sel[it.clave]))
    &&(!q||it.nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q))).forEach(it=>L.appendChild(card(it)));
}
[fMes,fEstado].forEach(x=>x.onchange=pintar);fBus.oninput=pintar;
document.getElementById('exp').onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const filas=[['tipo','clave','fecha','nombre','imagen_fija'].join(',')];
  D.items.forEach(it=>{if(sel[it.clave])filas.push([it.tipo,it.clave,it.fecha,it.nombre,sel[it.clave]].map(q).join(','))});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+filas.join('\n')],{type:'text/csv'}));
  a.download='seleccion_imagenes.csv';a.click()};
prog();pintar();
</script></body></html>
